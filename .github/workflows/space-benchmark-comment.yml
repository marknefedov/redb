name: Space benchmark comment

on:
  workflow_run:
    workflows: [Space benchmark]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the default branch is checked out in this privileged workflow. PR artifacts
      # are parsed as JSON, never executed, including for PRs opened from forks.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: space-results
          path: space-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Render untrusted numeric results
        run: python3 scripts/space-report.py space-artifact/space-results.json --output space-results.md
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            let prs = run.pull_requests;
            if (prs.length === 0) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo, commit_sha: run.head_sha
              });
              prs = associated.data.filter(pr => pr.head.sha === run.head_sha && pr.state === 'open');
            }
            if (prs.length !== 1) {
              core.setFailed('Expected exactly one pull request for this benchmark run');
              return;
            }
            const issue_number = prs[0].number;
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: issue_number});
            if (pr.head.sha !== run.head_sha || pr.state !== 'open') return;
            const marker = '<!-- redb-space-benchmark -->';
            const body = `${marker}\nResults for ${run.head_sha}\n\n${fs.readFileSync('space-results.md', 'utf8')}\n\n[Benchmark run](${run.html_url})`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number});
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number, body});
            }

