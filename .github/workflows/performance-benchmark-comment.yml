name: Performance benchmark comment

on:
  workflow_run:
    workflows: [Performance benchmarks]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch supplies executable code; artifacts are only bounded numeric JSON.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: performance-results
          path: performance-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Render untrusted numeric comparison
        run: python3 scripts/performance-report.py performance-artifact/performance-results.json --output performance-results.md
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const artifact = 'performance-artifact/performance-results.json';
            if (fs.statSync(artifact).size > 256 * 1024) throw new Error('Oversized report');
            const report = JSON.parse(fs.readFileSync(artifact, 'utf8'));
            if (report.head_sha !== run.head_sha) throw new Error('Mismatched benchmark commit');
            let prs = run.pull_requests;
            if (prs.length === 0) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo, commit_sha: run.head_sha
              });
              prs = associated.data.filter(pr => pr.head.sha === run.head_sha && pr.state === 'open');
            }
            if (prs.length !== 1) {
              core.setFailed('Expected exactly one pull request for this benchmark run');
              return;
            }
            const issue_number = prs[0].number;
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: issue_number});
            if (pr.head.sha !== run.head_sha || pr.state !== 'open') return;
            const marker = '<!-- redb-performance-benchmark -->';
            const body = `${marker}\n${fs.readFileSync('performance-results.md', 'utf8')}\n\n[Benchmark run](${run.html_url})`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number});
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number, body});
